# Noun and adjective paradigms, Appendix A of Lambdin and Huehnergard's
# The Aramaic of Targum Onqelos.
#
# A shape is written with C for each root consonant, the vowels spelled out,
# and a hyphen before the ending, so šappirǝtā is CaCCiC-ǝtā. Every shape is
# derived from the example beside it rather than transcribed. pattern names
# the base with the q-t-l dummy root, the convention the grammars use, so a
# type can be looked up.
#
# Where one shape fills more than one slot its card says so, since that
# syncretism is itself worth knowing. See README.md for the fields.

- paradigm: Unchanging base
  reference: A.1
  pattern: qattil
  lemma: šappir ‘beautiful’
  notes: The base never changes; only the ending does. Note that the masculine singular emphatic and the feminine singular absolute are the same shape.
  cells:
    - slot: masculine singular absolute, masculine singular construct
      shape: CaCCiC
      example: šappir
    - slot: masculine singular emphatic, feminine singular absolute
      shape: CaCCiC-ā
      example: šappirā
    - slot: masculine plural absolute
      shape: CaCCiC-in
      example: šappirin
    - slot: masculine plural construct
      shape: CaCCiC-e
      example: šappire
    - slot: masculine plural emphatic
      shape: CaCCiC-ayyā
      example: šappirayyā
    - slot: feminine singular construct
      shape: CaCCiC-at
      example: šappirat
    - slot: feminine singular emphatic
      shape: CaCCiC-ǝtā
      example: šappirǝtā
    - slot: feminine plural absolute
      shape: CaCCiC-ān
      example: šappirān
    - slot: feminine plural construct
      shape: CaCCiC-āt
      example: šappirāt
    - slot: feminine plural emphatic
      shape: CaCCiC-ātā
      example: šappirātā

- paradigm: Adjective with final -y
  reference: A.4a
  pattern: qatly
  lemma: qǝše ‘hard, difficult’
  notes: Also the G passive participle of verbs III-Weak. The third radical is y, which surfaces before a vowel and is lost before a consonant.
  cells:
    - slot: masculine singular absolute
      shape: CǝC-e/CǝC-i
      example: qǝše/qǝši
    - slot: masculine singular construct
      shape: CǝC-e
      example: qǝše
    - slot: masculine singular emphatic, feminine singular absolute
      shape: CaCC-ā
      example: qašyā
    - slot: masculine plural absolute
      shape: CǝC-an
      example: qǝšan
    - slot: masculine plural construct
      shape: CǝC-e/CaCC-e
      example: qǝše/qašye
    - slot: masculine plural emphatic
      shape: CǝC-ayyā
      example: qǝšayyā
    - slot: feminine singular construct
      shape: CaCC-at/CǝC-it
      example: qašyat/qǝšit
    - slot: feminine singular emphatic
      shape: CaCC-ǝtā/CǝC-itā
      example: qašyǝtā/qǝšitā
    - slot: feminine plural absolute
      shape: CaCC-ān
      example: qašyān
    - slot: feminine plural construct
      shape: CaCC-āt
      example: qašyāt
    - slot: feminine plural emphatic
      shape: CaCC-ātā
      example: qašyātā


- paradigm: Abstract nouns in -itā and -utā
  reference: A.3a
  pattern: qatl+it / qatl+ut
  lemma: zarʕitā ‘descendant’
  notes: In this type -it and -ut are suffixes forming abstract nouns, and the base keeps its own shape throughout.
  cells:
    - slot: feminine singular absolute
      shape: CaCC-i
      example: zarʕi
    - slot: feminine singular construct
      shape: CaCC-it
      example: zarʕit
    - slot: feminine singular emphatic
      shape: CaCC-itā
      example: zarʕitā
    - slot: feminine plural emphatic
      shape: CaCC-ǝyātā
      example: zarʕǝyātā


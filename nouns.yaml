- paradigm: Feminine -vCtā, -a- syncopated
  reference: A.2a
  pattern: qatal+t
  lemma: ʕǝgaltā ‘heifer’
  notes: In this type the -a- of the base drops in the absolute and construct, and the first vowel fills out in its place.
  cells:
    - slot: feminine singular absolute
      shape: CaCC-ā
      example: ʕaglā
    - slot: feminine singular construct
      shape: CaCC-at
      example: ʕaglat
    - slot: feminine singular emphatic
      shape: CǝCaC-tā
      example: ʕǝgaltā
    - slot: feminine plural emphatic
      shape: CaCC-ātā
      example: ʕaglātā

- paradigm: Feminine -vCtā, -a- syncopated

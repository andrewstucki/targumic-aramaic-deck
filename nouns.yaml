- paradigm: Feminine -vCtā, geminate root
  reference: A.2a
  pattern: qatal+t
  lemma: ʕǝlaltā ‘produce’
  notes: In this type a root whose second and third radicals are the same cannot syncopate, so a sheva stands where the vowel dropped.
  cells:
    - slot: feminine singular absolute
      shape: CaCǝC-ā
      example: ʕalǝlā
    - slot: feminine singular construct
      shape: CaCǝC-at
      example: ʕalǝlat
    - slot: feminine singular emphatic
      shape: CǝCaC-tā
      example: ʕǝlaltā
    - slot: feminine plural emphatic
      shape: CaCǝC-ātā
      example: ʕalǝlātā

- paradigm: Feminine -vCtā, -i- or -e-

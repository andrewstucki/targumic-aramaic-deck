- paradigm: Nouns in -itā and -utā from III-w/y roots
  reference: A.3b
  pattern: qatl+ut
  lemma: kǝsutā ‘garment’
  notes: In this type here -it and -ut come from y or w as the third radical. Some follow the abstract nouns above; others keep traces of the older form, the radical reappearing in the absolute or the plural.
  cells:
    - slot: feminine singular absolute
      shape: CǝC-u
      example: kǝsu
    - slot: feminine singular construct
      shape: CǝC-ut
      example: kǝsut
    - slot: feminine singular emphatic
      shape: CǝC-utā
      example: kǝsutā


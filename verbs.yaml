      example: יִכתֹוב yiktob
    - slot: 3fs, 2ms
      shape: ti-CCoC
      example: תִכתֹוב tiktob
    - slot: 2fs
      shape: ti-CCǝC-in
      example: תִכתְבִין tiktǝbin
    - slot: 1cs
      shape: ʔi-CCoC
      example: אִכתֹוב ʔiktob
    - slot: 3mp
      shape: yi-CCǝC-un
      example: יִכתְבֻון yiktǝbun
    - slot: 3fp
      shape: yi-CCǝC-ān
      example: יִכתְבָן yiktǝbān
    - slot: 2mp
      shape: ti-CCǝC-un
      example: תִכתְבֻון tiktǝbun
    - slot: 2fp
      shape: ti-CCǝC-ān
      example: תִכתְבָן tiktǝbān
    - slot: 1cp
      shape: ni-CCoC
      example: נִכתֹוב niktob


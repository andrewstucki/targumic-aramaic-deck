      shape: CaCCeC-t
      example: כַתֵיבת kattebt
    - slot: 2ms, longer variant
      shape: CaCCeC-tā
      example: כַתֵיבתָא kattébtā
    - slot: 1cs
      shape: CaCCeC-it
      example: כַתֵיבִית kattébit
    - slot: 3mp
      shape: CaCCiC-u
      example: כַתִיבֻו kattíbu
    - slot: 3fp
      shape: CaCCiC-ā
      example: כַתִיבָא kattíbā
    - slot: 2mp
      shape: CaCCeC-tun
      example: כַתֵיבתֻון kattebtun
    - slot: 2fp
      shape: CaCCeC-tin
      example: כַתֵיבתִין kattebtin
    - slot: 1cp
      shape: CaCCeC-nā
      example: כַתֵיבנָא kattébnā


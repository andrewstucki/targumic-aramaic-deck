# Verb paradigms, Appendix B of Lambdin and Huehnergard's The Aramaic of
# Targum Onqelos. Same fields as nouns.yaml; see README.md.
#
# One paradigm per column and section of the table, every cell of it, so an
# alternation inside a column shows rather than being factored away: the
# theme vowel reduces before an ending that begins with a vowel — e to i in
# the stative and the Pael, o to u in the Peal imperative, and to sheva
# through the imperfect.
#
# A shape marks its morpheme boundaries with hyphens: the prefix, then the
# base with C for each root consonant, then the person ending.
#
# The verb tables print no transliteration, so each example carries the
# pointed Aramaic and a transliteration derived from it. A doubled consonant
# is spelled once in this system. It is restored where the vowels require
# it: a short, unaccented vowel in a syllable that would otherwise be open
# would have reduced to sheva, so if it has not, the next consonant closes
# the syllable. Where the accent is what protects the vowel instead, as in
# kǝtabat, nothing is doubled.

- paradigm: G (Peal) perfect, sound verb
  reference: B.1
  pattern: qǝtal
  lemma: kǝtab, G perfect
  notes: The basic stem.
  cells:
    - slot: 3ms
      shape: CǝCaC
      example: כְתַב kǝtab
    - slot: 3fs
      shape: CǝCaC-at
      example: כְתַבַת kǝtábat
    - slot: 2ms, 2fs
      shape: CǝCaC-t
      example: כְתַבת kǝtabt
    - slot: 2ms, longer variant
      shape: CǝCaC-tā
      example: כְתַבתָא kǝtábtā
    - slot: 1cs
      shape: CǝCaC-it
      example: כְתַבִית kǝtábit
    - slot: 3mp
      shape: CǝCaC-u
      example: כְתַבֻו kǝtábu
    - slot: 3fp
      shape: CǝCaC-ā
      example: כְתַבָא kǝtábā
    - slot: 2mp
      shape: CǝCaC-tun
      example: כְתַבתֻון kǝtabtun
    - slot: 2fp
      shape: CǝCaC-tin
      example: כְתַבתִין kǝtabtin
    - slot: 1cp
      shape: CǝCaC-nā
      example: כְתַבנָא kǝtábnā

- paradigm: G (Peal) imperfect, sound verb

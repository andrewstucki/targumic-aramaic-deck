- paradigm: D (Pael) perfect, sound verb
  reference: B.1
  pattern: qattil
  lemma: katteb, D perfect
  notes: "The second radical is doubled throughout, which this script does not mark: the a before it is short and unaccented and would otherwise stand open, so it would have reduced to sheva. That it has not means the syllable is closed, and the name Pael says the same. The theme vowel is not the same throughout — CaCCeC, CaCCiC — it reduces before an ending that begins with a vowel."
  cells:
    - slot: 3ms
      shape: CaCCeC
      example: כַתֵיב katteb
    - slot: 3fs
      shape: CaCCeC-at
      example: כַתֵיבַת kattébat

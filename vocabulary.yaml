# Targumic Aramaic vocabulary, by chapter of Lambdin and Huehnergard's
# The Aramaic of Targum Onqelos. See README.md for the fields.

- chapter: 1
  entries:
    - aramaic: [אְבַד]
      vocalization: [ʔǝbad]
      gloss: to perish, die
      pos: verb
      notes: (sometimes ʔabad).
      hebrew: ʔbd
    - aramaic: [אְזַל]
      vocalization: [ʔǝzal]
      gloss: to go
      pos: verb
      notes: (sometimes ʔazal).
      hebrew: hlk
    - aramaic: [נְטַל]
      vocalization: [nǝṭal]
      gloss: to raise, lift, take up; to set out, travel
      pos: verb
      hebrew: nsʕ
    - aramaic: [נְפַק]
      vocalization: [nǝpaq]
      gloss: to go forth
      pos: verb
      notes: nǝpaq min to depart from, leave (a place).
      hebrew: yṣʔ
    - aramaic: [עְרַק]
      vocalization: [ʕǝraq]
      gloss: to flee
      pos: verb
      hebrew: brḥ,nws
    - aramaic: [אִיתְתָא]
      vocalization: [ʔittǝtā]
      gloss: woman, wife
      pos: noun
      hebrew: ʔiššā
    - aramaic: [גֻוברָא, גַברָא]
      vocalization: [gubrā, gabrā]
      gloss: man
      pos: noun
      hebrew: ʔîš
    - aramaic: [טֻורָא]
      vocalization: [ṭurā]
      gloss: mountain
      pos: noun
      hebrew: har
    - aramaic: [מַלכָא]
      vocalization: [malkā]
      gloss: king
      pos: noun
      hebrew: mélek
    - aramaic: [מַלכְתָא]
      vocalization: [malkǝtā]
      gloss: queen
      pos: noun
      hebrew: malkā
    - aramaic: [עַמָא]
      vocalization: [ʕammā]
      gloss: people, the people; nation
      pos: noun
      notes: Verbal agreement with ʕammā may be singular or plural.
      hebrew: ʕam
    - aramaic: [קַרתָא]
      vocalization: [qartā]
      gloss: city
      pos: noun
      hebrew: ʕîr
    - aramaic: [לְ]
      vocalization: [lǝ-]
      gloss: to, for (a person), to, into (a place)
      pos: preposition
      hebrew: lǝ-/ʔel
    - aramaic: [מִין, מִן]
      vocalization: [min]
      gloss: "from, out of; also partitive: some of"
      pos: preposition
      hebrew: min
    - aramaic: [לָא]
      vocalization: [lā]
      gloss: (negative)
      pos: adverb
      hebrew: ʔal
    - aramaic: [תַמָן]
      vocalization: [tammān]
      gloss: there, in that place
      pos: adverb
      notes: lǝ-tammān to there, thither; mit-tammān from there, thence.
      hebrew: šām

- chapter: 2
  entries:
    - aramaic: [דְבַר]
      vocalization: [dǝbar]
      gloss: to take, to lead (away)
      pos: verb
      notes: direct object is (1) a person or animal one takes along from one place to another; or (2) a person one takes as part of one’s group, household, or family.
      hebrew: lqḥ
    - aramaic: [כְתַב]
      vocalization: [kǝtab]
      gloss: to write
      pos: verb
      hebrew: ktb
    - aramaic: [עְבַר]
      vocalization: [ʕǝbar]
      gloss: "to cross (something: yāt or bǝ-); to transgress"
      pos: verb
      hebrew: ʕbr
    - aramaic: [פְלַח]
      vocalization: [pǝlaḥ]
      gloss: to serve (as slave, etc.)
      pos: verb
      hebrew: ʕbd
    - aramaic: [קְטַל]
      vocalization: [qǝṭal]
      gloss: to kill
      pos: verb
      hebrew: hrg/qṭl
    - aramaic: [אַרעָא]
      vocalization: [ʔarʕā]
      gloss: land, country; the earth
      pos: noun
      notes: (feminine).
      hebrew: ʔéreṣ
    - aramaic: [כַספָא]
      vocalization: [kaspā]
      gloss: silver, money
      pos: noun
    - aramaic: [נַהרָא]
      vocalization: [nahrā]
      gloss: river
      pos: noun
      hebrew: nāhār
    - aramaic: [פִתגָמָא]
      vocalization: [pitgāmā]
      gloss: word, thing, affair
      pos: noun
      hebrew: dābār
    - aramaic: [צַפרָא]
      vocalization: [ṣaprā]
      gloss: morning
      pos: noun
      hebrew: bṓqer
    - aramaic: [קִניָנָא]
      vocalization: [qinyānā]
      gloss: property, possessions
      pos: noun
    - aramaic: [רַמשָא]
      vocalization: [ramšā]
      gloss: evening
      pos: noun
      hebrew: ʕéreb
    - aramaic: [בְ]
      vocalization: [bǝ-]
      gloss: in, within; with (instrumental)
      pos: preposition
      hebrew: bǝ-
    - aramaic: [יָת]
      vocalization: [yāt]
      gloss: direct object marker
      pos: particle
      hebrew: ʔet-/ʔēt
    - aramaic: [לְמָא, עַל מָא]
      vocalization: [lǝmā, ʕal mā]
      gloss: why?
      pos: adverb
      notes: (interrogative).
      hebrew: lā́mmā

- chapter: 3
  entries:
    - aramaic: [יְהַב]
      vocalization: [yǝhab]
      gloss: to give; to place, set
      pos: verb
      hebrew: ntn
    - aramaic: [נְחַת]
      vocalization: [nǝḥat]
      gloss: to come/go down, descend
      pos: verb
      notes: (also nǝḥet; see §5.1).
      hebrew: yrd
    - aramaic: [נְפַל]
      vocalization: [nǝpal]
      gloss: to fall
      pos: verb
      hebrew: npl
    - aramaic: [פְרַס]
      vocalization: [pǝras]
      gloss: to pitch (a tent)
      pos: verb
      hebrew: nṭh
    - aramaic: [בֵיתָא]
      vocalization: [betā]
      gloss: house
      pos: noun
      notes: (masculine).
      hebrew: báyit
    - aramaic: [לַחמָא]
      vocalization: [laḥmā]
      gloss: bread, food
      pos: noun
      hebrew: léḥem
    - aramaic: [מַיָא]
      vocalization: [mayyā]
      gloss: water
      pos: noun
      notes: (plural).
      hebrew: máyim
    - aramaic: [מֵישְרָא]
      vocalization: [mešǝrā]
      gloss: plain, valley
      pos: noun
      hebrew: mîšôr
    - aramaic: [מַשכְנָא]
      vocalization: [maškǝnā]
      gloss: tent, habitation
      pos: noun
      hebrew: ʔṓhel/miškān
    - aramaic: [לְוָת]
      vocalization: [lǝwāt]
      gloss: to, unto, into the presence of (a person)
      pos: preposition
      hebrew: ʔel/lipnê
    - aramaic: [עַד]
      vocalization: [ʕad]
      gloss: up to, as far as, until
      pos: preposition
      hebrew: ʕad ʕôlām
    - aramaic: [עַל]
      vocalization: [ʕal]
      gloss: on, down onto; against; about, concerning, in regard to
      pos: preposition
      hebrew: bwʔ
    - aramaic: [מֵעַל]
      vocalization: [me-ʕal]
      gloss: from upon
      pos: preposition
      hebrew: mēʕal
    - aramaic: [מִלְוָת]
      vocalization: [mil-lǝwāt]
      gloss: from the presence of
      pos: preposition
      hebrew: mil-lipnê

- chapter: 4
  entries:
    - aramaic: [אְכַל]
      vocalization: [ʔǝkal]
      gloss: to eat
      pos: verb
      hebrew: ʔkl
    - aramaic: [גְזַר]
      vocalization: [gǝzar]
      gloss: to cut; to circumcise
      pos: verb
      notes: gǝzar qǝyām ʕim to make a covenant with.
      hebrew: gzr/krt
    - aramaic: [מְסַר]
      vocalization: [mǝsar]
      gloss: "to hand over (to, into the hand of: bǝ-yad, lǝ-, or qǝdām)"
      pos: verb
    - aramaic: [נְטַר]
      vocalization: [nǝṭar]
      gloss: to guard, preserve, keep, observe
      pos: verb
      hebrew: nṣr
    - aramaic: [רְדַף]
      vocalization: [rǝdap]
      gloss: to pursue (obj. with bātar)
      pos: verb
      hebrew: rdp
    - aramaic: [רְהַט]
      vocalization: [rǝhaṭ]
      gloss: to run
      pos: verb
      notes: (also rǝheṭ; see lesson 5).
      hebrew: rwṣ
    - aramaic: [שְבַק]
      vocalization: [šǝbaq]
      gloss: "to leave, abandon, forsake; with lǝ-: to forgive"
      pos: verb
      hebrew: ʕzb
    - aramaic: [הֵיכְלָא]
      vocalization: [hekǝlā]
      gloss: palace, temple
      pos: noun
      hebrew: hêkāl
    - aramaic: [עֻולֵימָא]
      vocalization: [ʕulemā]
      gloss: boy, lad; servant, attendant
      pos: noun
      hebrew: náʕar/ʕélem
    - aramaic: [עֻולֵימְתָא]
      vocalization: [ʕulemǝtā]
      gloss: girl, maiden
      pos: noun
      hebrew: naʕărā/ʕalmā
    - aramaic: [קְיָמָא]
      vocalization: [qǝyāmā]
      gloss: treaty, covenant
      pos: noun
      notes: also qiyāmā; gǝzar qǝyām ʕim to make a covenant with.
      hebrew: bǝrît
    - aramaic: [בְגֹו]
      vocalization: [bǝ-go]
      gloss: in, within, in the midst of
      pos: preposition
      notes: (with suffix bǝ-gawwi, etc.).
      hebrew: bǝ-tôk
    - aramaic: [מִגֹו]
      vocalization: [mig-go]
      gloss: from within, from the midst of
      pos: preposition
      notes: (with suffix mig-gawwi, etc.).
      hebrew: mit-tôk
    - aramaic: [בְיַד]
      vocalization: [bǝ-yad]
      gloss: into the hand/power of
      pos: preposition
    - aramaic: [בָתַר]
      vocalization: [bātar]
      gloss: after, behind (both spatial and temporal meanings)
      pos: preposition
      notes: pronominal suffixes with bātar are given in §7.2.
      hebrew: ʔaḥărê
    - aramaic: [כְ]
      vocalization: [kǝ-]
      gloss: like, as, according to
      pos: preposition
      notes: kǝ- does not take pronominal suffixes.
      hebrew: kǝ-
    - aramaic: [עִם]
      vocalization: [ʕim]
      gloss: with, together with
      pos: preposition
      notes: (with suffix ʕimmi, etc.).
      hebrew: ʕim/ʔet-/ʔēt
    - aramaic: [קְדָם]
      vocalization: [qǝdām]
      gloss: before, in the presence of
      pos: preposition
      notes: min qǝdām from before, from the presence of; pronominal suffixes with qǝdām are given in §7.2.
      hebrew: lipnê

- chapter: 5
  entries:
    - aramaic: [דְחֵיל]
      vocalization: [dǝḥel]
      gloss: to be afraid, fear (object usually with min or min qǝdām)
      pos: verb
      hebrew: yrʔ
    - aramaic: [יְתֵיב]
      vocalization: [yǝteb]
      gloss: to sit, dwell, remain, settle
      pos: verb
      hebrew: yšb
    - aramaic: [נְסֵיב, נְסַב]
      vocalization: [nǝseb, nǝsab]
      gloss: to take
      pos: verb
      notes: (the most general verb of ‘taking’; includes all the meanings noted for dǝbar as well).
      hebrew: lqḥ
    - aramaic: [סְגֵיד]
      vocalization: [sǝged]
      gloss: to bow down
      pos: verb
      hebrew: hištaḥăwā
    - aramaic: [סְלֵיק]
      vocalization: [sǝleq]
      gloss: to go up, ascend (intrans.)
      pos: verb
      hebrew: ʕlh
    - aramaic: [קְרֵיב]
      vocalization: [qǝreb]
      gloss: "to approach, draw near (to: lǝ-, lǝwāt); to be on the point of (+ infinitive)"
      pos: verb
      notes: qǝreb bǝ- to come into contact with, touch.
      hebrew: qrb
    - aramaic: [תְקֵיף]
      vocalization: [tǝqep]
      gloss: to grow strong, be strong; to be severe; to become rich, wealthy
      pos: verb
      notes: tǝqep lǝ-N N became angry (e.g., tǝqep lǝ-malkā the king became angry; tǝqep li I became angry).
      hebrew: kbd/ḥzq
    - aramaic: [דָרֹומָא]
      vocalization: [dāromā]
      gloss: the south
      pos: noun
      notes: mid-dāromā lǝ- on the south of.
      hebrew: dārôm
    - aramaic: [כַפנָא]
      vocalization: [kapnā]
      gloss: famine, hunger
      pos: noun
      hebrew: rāʕāb
    - aramaic: [מַדבְרָא]
      vocalization: [madbǝrā]
      gloss: desert, steppe, wilderness
      pos: noun
    - aramaic: [מַדנְחָא]
      vocalization: [madnǝḥā]
      gloss: the east
      pos: noun
      notes: also madinḥā; lǝ-madnǝḥā east(ward); mim-madnǝḥā on the east; mim-madnaḥ (or madnǝḥā) lǝ- on/to the east of.
      hebrew: mizrāḥ
    - aramaic: [מַערְבָא]
      vocalization: [maʕrǝbā]
      gloss: the west
      pos: noun
      notes: also maʕarḇā; mim-maʕrǝbā on the west.
      hebrew: maʕărāb
    - aramaic: [מִצרַיִם]
      vocalization: [Miṣráyim]
      gloss: Egypt
      pos: noun
      hebrew: Miṣráyim
    - aramaic: [צִיפֻונָא]
      vocalization: [ṣippunā]
      gloss: the north
      pos: noun
      hebrew: ṣāpōn

- chapter: 6
  entries:
    - aramaic: [רְחֵים]
      vocalization: [rǝḥem]
      gloss: to love
      pos: verb
      hebrew: ʔhb
    - aramaic: [אַמתָא]
      vocalization: [ʔamṯā]
      gloss: female servant, slave
      pos: noun
      hebrew: ʔāmā
    - aramaic: [אַתָנָא, אְתָנָא]
      vocalization: [ʔattānā, ʔǝtānā]
      gloss: female donkey
      pos: noun
      hebrew: ʔātōn
    - aramaic: [בְעִירָא]
      vocalization: [bǝʕirā]
      gloss: cattle
      pos: noun
      hebrew: bāqār/bǝʕîr
    - aramaic: [בַעלָא]
      vocalization: [baʕlā]
      gloss: husband
      pos: noun
      hebrew: báʕal
    - aramaic: [בְרָא]
      vocalization: [bǝrā]
      gloss: son
      pos: noun
      hebrew: bĕn
    - aramaic: [בְרַתָא]
      vocalization: [bǝrattā]
      gloss: daughter
      pos: noun
      hebrew: bat
    - aramaic: [גִינְתָא]
      vocalization: [ginnǝtā]
      gloss: garden
      pos: noun
      hebrew: gan(nā)
    - aramaic: [גַמלָא]
      vocalization: [gamlā]
      gloss: camel
      pos: noun
      hebrew: gāmāl
    - aramaic: [חְמָרָא]
      vocalization: [ḥǝmārā]
      gloss: male donkey
      pos: noun
      hebrew: ḥămôr
    - aramaic: [חַקלָא]
      vocalization: [ḥaqlā]
      gloss: field
      pos: noun
      hebrew: śāde
    - aramaic: [חַרבָא]
      vocalization: [ḥarbā]
      gloss: sword
      pos: noun
      notes: (feminine).
      hebrew: ḥéreb
    - aramaic: [עַבדָא]
      vocalization: [ʕabdā]
      gloss: male servant, slave; attendant
      pos: noun
      hebrew: ʕébed
    - aramaic: [עָנָא]
      vocalization: [ʕānā]
      gloss: flock(s) (sheep and goats)
      pos: noun
      notes: feminine; sometimes construed as feminine plural.
      hebrew: ṣō(ʔ)n
    - aramaic: [רֻוגזָא]
      vocalization: [rugzā]
      gloss: anger, wrath
      pos: noun
      notes: tǝqep rugzeh bǝ- he became angry at/with.
      hebrew: rṓgez
    - aramaic: [תֹורָא]
      vocalization: [torā]
      gloss: bull, ox
      pos: noun
      hebrew: šôr/ʔélep
    - aramaic: [תֹורְתָא]
      vocalization: [torǝtā]
      gloss: cow
      pos: noun
      hebrew: pārā?

- chapter: 7
  entries:
    - aramaic: [קְדָם]
      vocalization: [qǝdām]
      gloss: before, in the presence of
      pos: preposition
      notes: (with a suffix, the base is qǝdām-).
      hebrew: lipnê
    - aramaic: [תְחֹות]
      vocalization: [tǝḥot]
      gloss: under, beneath
      pos: preposition
      notes: with a suffix, the base is tǝḥot- (but 3rd fem. sg. is tǝḥot-ah).
      hebrew: táḥat
    - aramaic: [בֵין]
      vocalization: [ben]
      gloss: between
      pos: preposition
      notes: with a suffix, the base is ben- (but 1st pers. sg. is ben-a, sometimes ben-i).
      hebrew: bên
    - aramaic: [עַל]
      vocalization: [ʕal]
      gloss: on, upon (I)
      pos: preposition
      notes: with a suffix, the base is ʕǝl- (but 3rd fem. sg. is ʕǝl-ah).
      hebrew: bwʔ
    - aramaic: [עִילָוֵי]
      vocalization: [ʕillāwe]
      gloss: on, upon (II)
      pos: preposition
      notes: with a suffix, the base is ʕillāw-; a synonym of ʕal, used especially in the compound me-ʕillāwe (= me-ʕal) when pronominal suffixes are required.
    - aramaic: [אְחַד]
      vocalization: [ʔǝḥad]
      gloss: to seize, grasp, lay hold of; to close (a door)
      pos: verb
      hebrew: ʔḥz
    - aramaic: [אְמַר]
      vocalization: [ʔǝmar]
      gloss: to say
      pos: verb
      hebrew: ʔmr
    - aramaic: [יְדַע]
      vocalization: [yǝdaʕ]
      gloss: to know
      pos: verb
      hebrew: ydʕ
    - aramaic: [יְרֵית]
      vocalization: [yǝret]
      gloss: to inherit
      pos: verb
      hebrew: yrš
    - aramaic: [נְצַב]
      vocalization: [nǝṣab]
      gloss: to plant
      pos: verb
      hebrew: nṭʕ
    - aramaic: [עְבַד]
      vocalization: [ʕǝbad]
      gloss: to do, act; to make, fashion
      pos: verb
      hebrew: ʕśh
    - aramaic: [פְתַח]
      vocalization: [pǝtaḥ]
      gloss: to open
      pos: verb
      hebrew: ptḥ
    - aramaic: [אִילָנָא]
      vocalization: [ʔilānā]
      gloss: tree
      pos: noun
      hebrew: ʕēṣ
    - aramaic: [דַשָא]
      vocalization: [daššā]
      gloss: door, doorleaf
      pos: noun
      hebrew: délet
    - aramaic: [יֹומָא]
      vocalization: [yomā]
      gloss: day
      pos: noun
      hebrew: yôm
    - aramaic: [לֵילְיָא]
      vocalization: [lelǝyā]
      gloss: night
      pos: noun
      hebrew: laylā
    - aramaic: [תַרעָא]
      vocalization: [tarʕā]
      gloss: gate (of a city), doorway (of a house or tent)
      pos: noun
      hebrew: šáʕar
    - aramaic: [אְרֵי]
      vocalization: [ʔǝre]
      gloss: (the fact) that; when, since, because
      pos: conjunction
      notes: corresponds to Hebrew kî.
      hebrew: kî
    - aramaic: [כֹל]
      vocalization: [kol]
      gloss: all of, the whole of
      pos: noun
      notes: "also written with a qametz in imitation of Tiberian. Before an emphatic singular noun used definitely: kol mešǝrā the whole plain; kol qartā the whole city; kol ʔarʕā the whole earth, all the land; kol qinyāneh all of his property. With a suffix the base is kull-: kulleh ‘all of it (m)’."
      hebrew: kōl/kol-
    - aramaic: [מָא]
      vocalization: [mā]
      gloss: what?
      pos: pronoun
      notes: (interrogative).
      hebrew: mā
    - aramaic: [מַן]
      vocalization: [man]
      gloss: who?
      pos: pronoun
      notes: (interrogative).
      hebrew: mî

- chapter: 8
  entries:
    - aramaic: [זְבַן]
      vocalization: [zǝban]
      gloss: to buy, purchase
      pos: verb
    - aramaic: [נְפֵיש]
      vocalization: [nǝpeš]
      gloss: to become numerous, widespread
      pos: verb
    - aramaic: [שְכֵיב]
      vocalization: [šǝkeb]
      gloss: to lie down
      pos: verb
